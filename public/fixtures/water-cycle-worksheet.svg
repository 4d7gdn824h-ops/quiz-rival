<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" role="img" aria-label="Water cycle science worksheet fixture">
  <rect width="800" height="1100" fill="#eef6fb"/>
  <rect x="36" y="36" width="728" height="1028" fill="none" stroke="#1d3a4d" stroke-width="2"/>
  <text x="60" y="80" font-family="Georgia, serif" font-size="18" fill="#4d6a7a">Class 5 · science · water cycle</text>
  <text x="60" y="130" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#10232e">Water cycle  worksheet</text>
  <text x="60" y="168" font-family="Georgia, serif" font-size="18" fill="#2c4a5a">Study the notes. Do not copy a finished answer sheet.</text>
  <text x="60" y="210" font-family="Georgia, serif" font-size="16" fill="#4d6a7a">Name: _______________    Class: 5</text>
  <text x="60" y="238" font-family="Georgia, serif" font-size="16" fill="#4d6a7a">School: ................................</text>
  <line x1="60" y1="260" x2="740" y2="260" stroke="#b7cdd8"/>
  <text x="60" y="300" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#10232e">I. Facts</text>
  <text x="60" y="336" font-family="Georgia, serif" font-size="17" fill="#10232e">1. Water evaporates from oceans, lakes, and puddles when the sun heats it.</text>
  <text x="60" y="372" font-family="Georgia, serif" font-size="17" fill="#10232e">2. Warm water vapor rises, cools, and condenses into tiny droplets</text>
  <text x="60" y="400" font-family="Georgia, serif" font-size="17" fill="#10232e">   that make clouds.</text>
  <text x="60" y="436" font-family="Georgia, serif" font-size="17" fill="#10232e">3. Precipitation is rain, snow, sleet, or hail falling from clouds.</text>
  <text x="60" y="472" font-family="Georgia, serif" font-size="17" fill="#10232e">4. The water cycle has no beginning or end  water keeps moving</text>
  <text x="60" y="500" font-family="Georgia, serif" font-size="17" fill="#10232e">   through earth, air, and sky.</text>
  <text x="60" y="550" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#10232e">II. Label</text>
  <text x="60" y="586" font-family="Georgia, serif" font-size="17" fill="#10232e">Label the diagram: evaporation, condensation, precipitation.</text>
  <rect x="60" y="620" width="680" height="200" fill="#f7fbfe" stroke="#b7cdd8"/>
  <text x="76" y="650" font-family="Georgia, serif" font-size="14" fill="#7a94a2">Student drawing box  QuizRival does not fill this in.</text>
  <text x="60" y="870" font-family="Georgia, serif" font-size="14" fill="#4d6a7a">Parent signature: __________     Page 1 / 1</text>
  <text x="60" y="900" font-family="Georgia, serif" font-size="13" fill="#7a94a2">English science fixture for QuizRival (no API key required).</text>
</svg>
